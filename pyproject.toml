[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "researchgraph-portfolio"
version = "0.1.0"
description = "Evidence-linked researcher discovery — an explicitly labeled research prototype"
requires-python = ">=3.11"
dependencies = ['numpy>=1.26,<3', 'torch>=2.6,<3', 'scikit-learn>=1.5,<2', 'fastapi>=0.115,<1', 'uvicorn>=0.30,<1', 'pydantic>=2.9,<3', 'httpx>=0.27,<1', 'networkx>=3.3,<4']
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.8,<1"]
integrations = ['sentence-transformers>=3,<6', 'faiss-cpu>=1.9,<2', 'neo4j>=5,<7']
browser = ["playwright>=1.45,<2"]
[project.scripts]
researchgraph = "researchgraph.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
researchgraph = ["static/*", "assets/artifacts/*", "assets/data/*", "assets/data/samples/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
